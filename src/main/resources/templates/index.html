<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product CRUD</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            background: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        form {
            background: white;
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
        }

        input {
            padding: 10px;
            margin-right: 10px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
        }

        th {
            background: #333;
            color: white;
        }

        a {
            margin-right: 10px;
        }
    </style>
</head>

<body>

<h1>Product Management System</h1>

<h2>Add / Edit Product</h2>

<form th:action="@{/save}" th:object="${product}" method="post">

    <input type="hidden" th:field="*{id}">

    <input type="text"
           th:field="*{name}"
           placeholder="Product name"
           required>

    <input type="number"
           step="0.01"
           th:field="*{price}"
           placeholder="Price"
           required>

    <button type="submit">Save Product</button>

</form>

<h2>Products</h2>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>

    <tr th:each="product : ${products}">
        <td th:text="${product.id}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.price}"></td>

        <td>
            <a th:href="@{/edit/{id}(id=${product.id})}">Edit</a>
            <a th:href="@{/delete/{id}(id=${product.id})}">Delete</a>
        </td>
    </tr>

</table>

</body>
</html>
